<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b0b10'/%3E%3Cpath d='M22 7v13.5a4 4 0 1 1-2-3.46V11l-8 2.2v9.3a4 4 0 1 1-2-3.46V11.5L22 7z' fill='%231db954'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b10" />
    <meta
      name="description"
      content="Resonate — free, open-source music player. Creative Commons streaming, free downloads, no ads."
    />
    <title>Resonate — free music, no ads</title>
    <script>
      // Apply the saved theme before React mounts to avoid a flash of the wrong mode.
      try {
        var saved = JSON.parse(localStorage.getItem("resonate:theme") || "{}");
        var mode = (saved.state && saved.state.mode) || "system";
        var dark =
          mode === "dark" ||
          (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
